# pnpm settings for the Angular client (single package, not a monorepo).

# pnpm rejects a workspace file without a packages list
packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  # The pre-commit hook is installed by the prepare script instead, which also runs for fresh clones
  simple-git-hooks: false

overrides:
  '@angular/build>undici': ^7.30.1
