<main>
  <div class="content-container">
    @if (errorOccurred) {
      <app-error-display (retry)="fetchSeriesData()"></app-error-display>
    }
    @else if (!hasLoaded) {
      <app-loading-state variant="bar" label="Széria adatok betöltése..."></app-loading-state>
    }
    @else {
      <div class="loading-host">
        <h2>Aktuális {{ seriesDetail?.shortName }} szavazások:</h2>
        <app-poll-list
          [polls]="polls"
          (pollChanged)="fetchSeriesData()"
          [currentSeriesShortName]="seriesDetail?.shortName!">
        </app-poll-list>

        <h2>Friss hírek ({{ seriesDetail?.shortName }}):</h2>
        <app-recent-news-list [articles]="articles"></app-recent-news-list>

        @if (isLoading) {
          <app-loading-state overlay></app-loading-state>
        }
      </div>

      <mat-card class="outer-card">
        <mat-card class="inner-card">

          @if (seriesImageUrl) {
            <img mat-card-image
                 [src]="seriesImageUrl"
                 [alt]="seriesDetail?.name">
          }

          <mat-card-content>
            <div class="description-content" [innerHTML]="seriesDetail?.description"></div>
            <h3 class="join-us">Kövess velünk minden {{ seriesDetail?.shortName }} eseményt!</h3>
          </mat-card-content>
        </mat-card>
      </mat-card>
    }
  </div>
</main>
