name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch makes the running checks outdated
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12'
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Stage 1: check

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Check client formatting (Prettier)
        working-directory: client
        run: pnpm format:check

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Check server formatting (dotnet format)
        run: dotnet format server/Drs-Zona.sln --verify-no-changes

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Lint client (ESLint)
        working-directory: client
        run: pnpm lint

  # Stage 2: test

  test-client:
    name: Test client
    needs: [format, lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests (Vitest)
        run: pnpm test --coverage
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-test-results
          path: |
            client/reports/
            client/coverage/
          if-no-files-found: ignore

  test-server:
    name: Test server
    needs: [format, lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Startup checks this before the test host swaps in its own JWT settings; any 32+ byte value works
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run tests (xUnit)
        run: dotnet test Drs-Zona.sln --logger "trx;LogFileName=test_results.trx" --results-directory TestResults
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: server/TestResults/
          if-no-files-found: ignore

  # Stage 3: build

  build:
    name: Build
    needs: [test-client, test-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish API
        run: dotnet publish server/API -c Release -o server/API/publish

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Build client
        working-directory: client
        run: pnpm build
